name: Flutter checks

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: flutter-checks-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/app/app.dart \
            lib/core/storage/app_database.dart \
            lib/features/connectivity/data/moysklad_api_client.dart \
            lib/features/connectivity/data/api_task_dispatcher.dart \
            lib/features/home/presentation/home_screen.dart \
            lib/features/references/data/reference_data_repository.dart \
            lib/features/references/presentation/product_inventory_screens.dart \
            lib/features/references/presentation/inventory_screens.dart \
            lib/features/references/presentation/reference_screens.dart \
            test/core/storage/app_database_test.dart \
            test/features/connectivity/moysklad_api_client_test.dart \
            test/features/connectivity/api_task_dispatcher_test.dart \
            test/features/home/home_screen_test.dart \
            test/features/home/placeholder_navigation_test.dart \
            test/features/references/reference_data_repository_test.dart

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/app/app.dart \
            lib/core/storage/app_database.dart \
            lib/features/connectivity/data/moysklad_api_client.dart \
            lib/features/home/presentation/home_screen.dart \
            lib/features/references/data/reference_data_repository.dart \
            lib/features/references/presentation/product_inventory_screens.dart \
            lib/features/references/presentation/inventory_screens.dart \
            lib/features/references/presentation/reference_screens.dart \
            test/core/storage/app_database_test.dart \
            test/features/connectivity/moysklad_api_client_test.dart \
            test/features/home/home_screen_test.dart \
            test/features/home/placeholder_navigation_test.dart \
            test/features/references/reference_data_repository_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format warehouse stock changes"
            git push
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test
